version: '3.8'

services:
  qiro-web:
    image: hubnexusai/gpfx-backend:latest
    environment:
      - DEBUG=False
      - SECRET_KEY=qiro-prod-secret-key-mudar-se-necessario
      - DB_NAME=qiro
      - DB_USER=postgres
      - DB_PASSWORD=hub123nexusai
      - DB_HOST=postgres
      - DB_PORT=5432
    networks:
      - traefik_public
      - digital_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.qiro_web.rule=Host(`qiro.testedev.online`)"
        - "traefik.http.routers.qiro_web.entrypoints=websecure"
        - "traefik.http.routers.qiro_web.priority=1"
        - "traefik.http.routers.qiro_web.tls.certresolver=le"
        - "traefik.http.routers.qiro_web.service=qiro_web"
        - "traefik.http.services.qiro_web.loadbalancer.server.port=8000"
        - "traefik.http.services.qiro_web.loadbalancer.passHostHeader=true"

networks:
  digital_network:
    external: true
    name: digital_network
  traefik_public:
    external: true
    name: traefik_public
