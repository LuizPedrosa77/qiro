{% extends "cliente/base_cliente.html" %}
{% block title %}QIRO — Perfil{% endblock %}
{% block content %}
<div class="mb-4"><h1 class="page-title">Meu perfil</h1><p class="page-subtitle">Mantenha seus dados de contato atualizados. O CPF não pode ser alterado.</p></div>
<form method="post" class="client-card p-4 p-md-5" style="max-width:850px">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label fw-semibold">Nome</label><input class="form-control" name="nome" value="{{ request.user.first_name }}" required></div><div class="col-md-6"><label class="form-label fw-semibold">Sobrenome</label><input class="form-control" name="sobrenome" value="{{ request.user.last_name }}"></div><div class="col-md-6"><label class="form-label fw-semibold">CPF</label><input class="form-control" value="{{ request.user.cpf }}" disabled><small class="text-secondary">O CPF não pode ser alterado.</small></div><div class="col-md-6"><label class="form-label fw-semibold">WhatsApp</label><input class="form-control" name="telefone" value="{{ request.user.telefone }}"></div><div class="col-12"><label class="form-label fw-semibold">E-mail</label><input class="form-control" name="email" type="email" value="{{ request.user.email }}"></div><div class="col-md-8"><label class="form-label fw-semibold">Cidade</label><input class="form-control" name="cidade" value="{{ request.user.cidade }}"></div><div class="col-md-4"><label class="form-label fw-semibold">UF</label><select class="form-select" name="estado"><option value="">Selecione</option>{% for uf in estados %}<option value="{{ uf }}" {% if request.user.estado == uf %}selected{% endif %}>{{ uf }}</option>{% endfor %}</select></div><div class="col-md-8"><label class="form-label fw-semibold">Endereço</label><input class="form-control" name="endereco" value="{{ request.user.endereco }}"></div><div class="col-md-4"><label class="form-label fw-semibold">Número</label><input class="form-control" name="numero" value="{{ request.user.numero }}"></div><div class="col-md-7"><label class="form-label fw-semibold">Bairro</label><input class="form-control" name="bairro" value="{{ request.user.bairro }}"></div><div class="col-md-5"><label class="form-label fw-semibold">CEP</label><input class="form-control" name="cep" value="{{ request.user.cep }}"></div><div class="col-12 pt-2"><button class="btn-client-primary w-100">Salvar alterações</button></div></div></form>
{% endblock %}
