<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QIRO — Acesso do Vaqueiro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --qiro-dark: #0F1F17;
            --qiro-green: #192D21;
            --qiro-yellow: #FACC15;
            --qiro-neutral: #BCB9B5;
            --qiro-white: #FBFBFB;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at 50% 20%, #1c3829 0%, #0F1F17 70%, #070e0a 100%);
            color: var(--qiro-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: #14261C;
            border: 1px solid #254231;
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .form-control {
            background-color: #0F1F17;
            border: 1px solid #254231;
            color: #FFF;
            padding: 0.8rem 1rem;
            border-radius: 12px;
        }

        .form-control:focus {
            background-color: #0F1F17;
            border-color: var(--qiro-yellow);
            color: #FFF;
            box-shadow: 0 0 0 0.25rem rgba(250, 204, 21, 0.2);
        }

        .btn-yellow-glow {
            background: linear-gradient(135deg, #FACC15 0%, #EAB308 100%);
            color: #000;
            font-weight: 800;
            border: none;
            border-radius: 12px;
            padding: 0.85rem;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-yellow-glow:hover {
            background: #FDE047;
            color: #000;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        
        <!-- VOLTAR -->
        <a href="/" class="text-secondary small text-decoration-none d-inline-flex align-items-center mb-4">
            <i class="bi bi-arrow-left me-1"></i> Voltar ao Início
        </a>

        <!-- LOGO & TÍTULO -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center gap-2 mb-2">
                <svg viewBox="0 0 100 80" style="width: 36px; height: 32px;" fill="#BCB9B5">
                    <path d="M75 10 C70 5, 55 12, 45 22 C40 27, 30 25, 25 35 C20 45, 22 55, 18 65 C17 68, 14 72, 12 75 L20 75 C24 68, 26 58, 28 50 C35 48, 45 52, 55 45 C65 38, 70 28, 75 22 C78 18, 82 15, 80 12 Z" />
                    <path d="M55 45 L62 75 L70 75 L62 48 L75 48 L85 75 L93 75 L80 40 C75 35, 68 40, 55 45 Z" />
                </svg>
                <span class="fs-2 fw-black" style="letter-spacing: -1.5px;">qiro</span>
            </div>
            <h4 class="fw-black text-white m-0">Acesso do Vaqueiro</h4>
            <p class="text-secondary small">Entre com seu CPF ou E-mail para gerenciar suas senhas na Secretaria</p>
        </div>

        <!-- MENSAGENS -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} small py-2 rounded-3 mb-3" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- FORMULÁRIO DE LOGIN -->
        <form method="POST" action="/cliente/login/">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">CPF ou E-mail</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="identificador" class="form-control" placeholder="000.000.000-00 ou seu@email.com" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="senha" class="form-control" placeholder="Digite sua senha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-yellow-glow fs-6 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i> Entrar na Secretaria
            </button>
        </form>

        <!-- LINK PARA CADASTRO -->
        <div class="text-center pt-3 border-top border-secondary border-opacity-25">
            <span class="text-secondary small">Ainda não tem cadastro?</span>
            <a href="/cliente/cadastro/" class="text-warning small fw-bold text-decoration-none d-block mt-1">
                Criar Cadastro Completo de Vaqueiro &rarr;
            </a>
        </div>

    </div>

</body>
</html>
