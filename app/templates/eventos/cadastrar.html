<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QIRO — Cadastrar Nova Vaquejada</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --qiro-bg: #0D1612;
            --qiro-card-bg: #15241C;
            --qiro-border: #233B2E;
            --qiro-yellow: #EAB308;
            --qiro-text-main: #F3F4F6;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--qiro-bg);
            color: var(--qiro-text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .form-card {
            background-color: var(--qiro-card-bg);
            border: 1px solid var(--qiro-border);
            border-radius: 20px;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .form-control, .form-select {
            background-color: #0E1A14;
            border: 1px solid var(--qiro-border);
            color: #FFF;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .form-control:focus, .form-select:focus {
            background-color: #0E1A14;
            border-color: var(--qiro-yellow);
            color: #FFF;
            box-shadow: 0 0 0 0.25rem rgba(234, 179, 8, 0.2);
        }

        .section-header {
            color: var(--qiro-yellow);
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--qiro-border);
            padding-bottom: 0.4rem;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }

        .btn-salvar {
            background-color: var(--qiro-yellow);
            color: #000;
            font-weight: 800;
            font-size: 1rem;
            border-radius: 12px;
            padding: 0.9rem;
            border: none;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .btn-salvar:hover {
            background-color: #FACC15;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="form-card">
        
        <!-- VOLTAR -->
        <a href="/" class="text-secondary small text-decoration-none d-inline-flex align-items-center mb-3">
            <i class="bi bi-arrow-left me-1"></i> Voltar à Vitrine de Vaquejadas
        </a>

        <!-- TÍTULO -->
        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom border-secondary border-opacity-25">
            <div class="p-2.5 rounded-3 bg-warning text-black fs-3 fw-bold">
                <i class="bi bi-trophy-fill"></i>
            </div>
            <div>
                <h3 class="fw-black text-white m-0" style="letter-spacing: -0.5px;">Cadastrar Nova Vaquejada</h3>
                <p class="text-secondary small mb-0">Crie o evento, defina o parque, datas, premiação e valores das senhas</p>
            </div>
        </div>

        <form method="POST" action="/eventos/cadastrar/">
            {% csrf_token %}

            <!-- 1. DADOS DO PARQUE -->
            <div class="section-header">
                <i class="bi bi-geo-alt-fill me-1"></i> 1. Parque de Vaquejada
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">Selecione um Parque Cadastrado ou Crie Novo *</label>
                <select name="parque_id" id="selectParque" class="form-select" onchange="toggleParqueNovo(this.value)">
                    <option value="novo">+ Cadastrar Novo Parque</option>
                    {% for p in parques %}
                    <option value="{{ p.id }}">{{ p.nome }} — {{ p.cidade }}/{{ p.estado }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- CAMPOS PARA PARQUE NOVO -->
            <div id="boxParqueNovo" class="p-3 mb-3 rounded-3 bg-black border border-secondary border-opacity-25">
                <div class="mb-2">
                    <label class="form-label text-secondary small fw-bold">Nome do Parque de Vaquejada *</label>
                    <input type="text" name="nome_parque_novo" class="form-control" placeholder="Ex: Parque Haras Beira Rio">
                </div>
                <div class="row g-2">
                    <div class="col-md-8">
                        <label class="form-label text-secondary small fw-bold">Cidade do Parque *</label>
                        <input type="text" name="cidade_parque" class="form-control" placeholder="Ex: Canhotinho">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-secondary small fw-bold">Estado (UF) *</label>
                        <input type="text" name="estado_parque" class="form-control text-uppercase" maxlength="2" placeholder="PE">
                    </div>
                </div>
            </div>

            <!-- 2. DADOS DA VAQUEJADA (EVENTO) -->
            <div class="section-header">
                <i class="bi bi-flag-fill me-1"></i> 2. Informações da Festa de Gado
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">Nome Oficial da Vaquejada *</label>
                <input type="text" name="nome_evento" class="form-control" placeholder="Ex: 45ª Grande Vaquejada do Parque Beira Rio" required>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label text-secondary small fw-bold">Circuito / Chancela</label>
                    <input type="text" name="circuito_chancela" class="form-control" placeholder="Ex: Campeonato Portal, Circuito PE/PB, ABQM">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-warning small fw-bold">Premiação Total (R$) *</label>
                    <input type="text" name="premiacao_total" class="form-control fw-bold" placeholder="150000.00" required>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label text-secondary small fw-bold">Data de Início da Corrida *</label>
                    <input type="date" name="data_inicio" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-secondary small fw-bold">Data de Término (Disputa) *</label>
                    <input type="date" name="data_fim" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">Programação / Atrações Musicais / Informações</label>
                <textarea name="descricao" class="form-control" rows="2" placeholder="Ex: Shows confirmados no sábado. Boiada padrão Nelore e Mobral."></textarea>
            </div>

            <!-- 3. CATEGORIAS E VALORES DAS SENHAS -->
            <div class="section-header">
                <i class="bi bi-tags-fill me-1"></i> 3. Valores das Senhas por Categoria
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-4">
                    <label class="form-label text-secondary small fw-bold">Categoria Aberta (R$)</label>
                    <input type="number" name="preco_aberta" class="form-control fw-bold" value="800" step="50">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-secondary small fw-bold">Categoria Amador (R$)</label>
                    <input type="number" name="preco_amador" class="form-control fw-bold" value="600" step="50">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-secondary small fw-bold">Categoria Aspirante (R$)</label>
                    <input type="number" name="preco_aspirante" class="form-control fw-bold" value="450" step="50">
                </div>
            </div>

            <div class="p-3 mb-4 rounded-3 bg-black border border-secondary border-opacity-25">
                <div class="text-secondary small fw-bold mb-2">Categorias Opcionais Adicionais:</div>
                <div class="row g-2">
                    <div class="col-md-6">
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="checkMaster" name="incluir_master">
                            <label class="form-check-label text-light small fw-bold" for="checkMaster">Incluir Categoria Master</label>
                        </div>
                        <input type="number" name="preco_master" class="form-control form-control-sm" value="400" placeholder="Valor Master">
                    </div>
                    <div class="col-md-6">
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" id="checkJovem" name="incluir_jovem">
                            <label class="form-check-label text-light small fw-bold" for="checkJovem">Incluir Categoria Jovem / Feminino</label>
                        </div>
                        <input type="number" name="preco_jovem" class="form-control form-control-sm" value="250" placeholder="Valor Jovem">
                    </div>
                </div>
            </div>

            <!-- BOTÃO SALVAR -->
            <button type="submit" class="btn-salvar">
                <i class="bi bi-check-circle-fill me-2"></i> Publicar Vaquejada no Portal QIRO
            </button>
        </form>

    </div>

    <script>
        function toggleParqueNovo(val) {
            const box = document.getElementById('boxParqueNovo');
            if (val === 'novo') {
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        }
    </script>
</body>
</html>
